adoption_gap_convention:
  gap_construction_convention: excluded_indicators
  gap_index_formula: 1 - average(min(LTE/benchmark_mean_LTE,1), min(fixed_speed/benchmark_mean_fixed,1),
    min(mobile_speed/benchmark_mean_mobile,1))
  normalization_method: relative_to_frontier_benchmark_set_mean_capped_at_1
  aipi_overlap_flag: false
  aipi_note_url: https://www.imf.org/external/datamapper/AIPINote.pdf
  pilot_gap_zero_status: historical diagnostic only; superseded for official 4C calibration
    by excluded coverage+speed Gap
  gap_values:
