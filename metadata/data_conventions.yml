stage_4a_prerun_governance:
  parameter_set_id: baseline-official-v1
  no_official_baseline_run: true
  bias_notes:
  - Disposable tax rates are frozen at r0 in the consumption chain; favorable second-order
    bias for r>=1 is declared.
  - theta_R_dom is anchored to (1-m_M).
  gmi_grid_convention: baseline grid should carry GMI_ideal_aggregate with warning;
    GMI_loaded_aggregate is a mandatory companion row for rankings.
