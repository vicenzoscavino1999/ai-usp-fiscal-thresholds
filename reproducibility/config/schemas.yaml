schemas:
  fiscal_space_result:
    file: fiscal_space_result.csv
    primary_key:
      - country_id
      - policy_variant_id
      - scenario_id
      - regime_id
      - xi
    columns:
      run_id: string
      model_version: string
      parameter_set_id: string
      dataset_version: string
      country_id: string
      policy_id: string
      policy_variant_id: string
      gmi_version: {type: string, nullable: true}
      scenario_id: string
      regime_id: string
      endpoint_year: int
      xi: float
      phi_y_nominal: float
      translation_factor: float
      g_ai_level: float
      mfc_gross: float
      mfc_tilde_gross: float
      fs_gross: float
      fs_eff: float
      cost_gross_gdp: float
      cost_net_gdp: float
      v_gross: float
      v_net: float
      crosses_v1: bool
      crosses_v1_10: bool
      crosses_buffer: bool
      debt_guardrail_pass: bool
      existence_condition_pass: bool
      historical_tax_class: string
      historical_tax_borderline: bool
      historical_total_revenue_class: string
      historical_total_revenue_borderline: bool
      cell_result_class: string
      endpoint_cost_rule: string
      country_policy_result_class: string
  threshold_inversion_result:
    file: threshold_inversion_result.csv
    primary_key:
      - country_id
      - policy_variant_id
      - requirement_basis
      - xi
      - scenario_id
      - regime_id
    columns:
      run_id: string
      model_version: string
      parameter_set_id: string
      dataset_version: string
      country_id: string
      policy_id: string
      policy_variant_id: string
      gmi_version: {type: string, nullable: true}
      requirement_basis: string
      xi: float
      scenario_id: string
      regime_id: string
      endpoint_year: int
      required_revenue_gdp: float
      g_ai_required: float
      mfc_required_gross: float
      historical_tax_class: string
      historical_tax_borderline: bool
      historical_total_revenue_class: string
      historical_total_revenue_borderline: bool
      realized_mfc_tax_class: string
      realized_mfc_tax_borderline: bool
      realized_mfc_total_revenue_class: string
      realized_mfc_total_revenue_borderline: bool
      t_required_H: float
      tau_ai_required: {type: float, nullable: true}
      q_prod_required: {type: float, nullable: true}
      q_use_required: {type: float, nullable: true}
      aipi_required: {type: float, nullable: true}
      exposure_required: {type: float, nullable: true}
      existence_condition_pass: bool
      impossibility_reason: {type: string, nullable: true}
      flags: {type: string, nullable: true}
      floor_driven_flag: bool
      epsilon_used: float
  historical_plausibility_result:
    file: historical_plausibility_result.csv
    primary_key:
      - country_id
      - scenario_id
      - regime_id
    columns:
      run_id: string
      country_id: string
      scenario_id: string
      regime_id: string
      mfc_gross: float
      tax_class: string
      tax_borderline: bool
      total_revenue_class: string
      total_revenue_borderline: bool
      parameter_set_id: string
      dataset_version: string
  country_policy_classification_preliminary:
    file: country_policy_classification_preliminary.csv
    primary_key:
      - country_id
      - policy_id
      - gmi_version
    columns:
      run_id: string
      country_id: string
      policy_id: string
      gmi_version: {type: string, nullable: true}
      country_policy_result_class: string
      probabilistic_leg: string
      parameter_set_id: string
      dataset_version: string
  monte_carlo_result:
    file: monte_carlo_result.csv
    tolerance_tier: tier_B
    primary_key:
      - country_id
      - policy_variant_id
      - scenario_id
      - regime_id
      - prob_basis
      - mc_mode
    columns:
      run_id: string
      model_version: string
      parameter_set_id: string
      dataset_version: string
      country_id: string
      policy_id: string
      policy_variant_id: string
      gmi_version: {type: string, nullable: true}
      scenario_id: string
      regime_id: string
      endpoint_year: int
      prob_basis: string
      mc_mode:
        type: string
        allowed_values:
          - MC_independent_baseline
          - mechanical_erosion_zero_diagnostic
          - historical_reduced_form_positive_tax
          - historical_reduced_form_mixture_tax
          - historical_reduced_form_positive_total_revenue
          - historical_reduced_form_mixture_total_revenue
          - MC_pairwise_05_check
          - MC_factor_nominal
          - MC_factor_rho03
          - MC_factor_rho07
          - MC_factor_rho08
      mc_n_draws: int
      v_p05: float
      v_p25: float
      v_p50: float
      v_p75: float
      v_p95: float
      valid_support_share: float
      valid_support_share_above_threshold: bool
      threshold_computability_share: float
      requirement_already_covered_share: float
      converged_flag: bool
      prob_v_ge_1_00: float
      prob_debt_consistent_1_00: float
      failure_severity_mean_1_00: float
      failure_severity_median_1_00: float
      prob_v_ge_1_05: float
      prob_debt_consistent_1_05: float
      failure_severity_mean_1_05: float
      failure_severity_median_1_05: float
      prob_v_ge_1_10: float
      prob_debt_consistent_1_10: float
      failure_severity_mean_1_10: float
      failure_severity_median_1_10: float
      prob_v_ge_1_25: float
      prob_debt_consistent_1_25: float
      failure_severity_mean_1_25: float
      failure_severity_median_1_25: float
      prob_v_ge_1_50: float
      prob_debt_consistent_1_50: float
      failure_severity_mean_1_50: float
      failure_severity_median_1_50: float
      prob_v_ge_1: float
  mc_convergence_report:
    file: mc_convergence_report.csv
    tolerance_tier: tier_B
    primary_key:
      - mc_mode
      - country_id
      - policy_variant_id
      - scenario_id
      - regime_id
      - mc_n_draws
    columns:
      run_id: string
      mc_mode:
        type: string
        allowed_values:
          - MC_independent_baseline
          - MC_factor_nominal
      country_id: string
      policy_variant_id: string
      scenario_id: string
      regime_id: string
      mc_n_draws: int
      prob_v_ge_1_10: float
      valid_support_share: float
      valid_support_share_above_threshold: bool
      delta_from_previous: {type: float, nullable: true}
      convergence_tolerance: float
      support_share_threshold: float
      converged_flag: bool
      parameter_set_id: string
      dataset_version: string
  mc_v2_to_v3_headline_deltas:
    file: mc_v2_to_v3_headline_deltas.csv
    tolerance_tier: tier_B
    primary_key:
      - country_id
      - policy_variant_id
      - scenario_id
      - regime_id
      - prob_basis
      - mc_mode
    columns:
      country_id: string
      policy_variant_id: string
      scenario_id: string
      regime_id: string
      prob_basis: string
      mc_mode: string
      prob_v_ge_1_v2: float
      prob_v_ge_1_10_v2: float
      valid_support_share_v2: float
      prob_v_ge_1_v3: float
      prob_v_ge_1_10_v3: float
      valid_support_share_v3: float
      delta_prob_v_ge_1: float
      abs_delta_prob_v_ge_1: float
      delta_prob_v_ge_1_10: float
      abs_delta_prob_v_ge_1_10: float
      delta_valid_support_share: float
      abs_delta_valid_support_share: float
      delta_soft_threshold: float
      delta_small_flag: bool
  mc_mode_comparison:
    file: mc_mode_comparison.csv
    tolerance_tier: tier_B
    primary_key:
      - country_id
      - policy_variant_id
      - scenario_id
      - regime_id
      - mc_mode
    columns:
      country_id: string
      policy_id: string
      policy_variant_id: string
      gmi_version: {type: string, nullable: true}
      scenario_id: string
      regime_id: string
      mc_mode:
        type: string
        allowed_values:
          - MC_independent_baseline
          - MC_pairwise_05_check
          - MC_factor_nominal
          - MC_factor_rho03
          - MC_factor_rho07
          - MC_factor_rho08
      prob_v_ge_1: float
      prob_v_ge_1_10: float
      prob_debt_consistent_1_10: float
      valid_support_share: float
  mc_threshold_crossings_between_modes:
    file: mc_threshold_crossings_between_modes.csv
    tolerance_tier: tier_B
    primary_key:
      - country_id
      - policy_variant_id
      - scenario_id
      - regime_id
      - probability_column
      - decision_threshold
    columns:
      country_id: string
      policy_variant_id: string
      scenario_id: string
      regime_id: string
      probability_column: string
      decision_threshold: float
      min_probability: float
      max_probability: float
      crosses_between_modes: bool
      modes_below: string
      modes_above: string
  mc_factor_pairwise_nominal_comparison:
    file: mc_factor_pairwise_nominal_comparison.csv
    tolerance_tier: tier_B
    primary_key:
      - country_id
      - policy_variant_id
      - scenario_id
      - regime_id
      - prob_basis
    columns:
      country_id: string
      policy_variant_id: string
      scenario_id: string
      regime_id: string
      prob_basis: string
      prob_v_ge_1_pairwise05: float
      prob_v_ge_1_10_pairwise05: float
      prob_v_ge_1_factor05: float
      prob_v_ge_1_10_factor05: float
      abs_diff_prob_v_ge_1: float
      abs_diff_prob_v_ge_1_10: float
      tier_b_probability_tolerance: float
      structure_inmaterial_within_tolerance: bool
  mc_dependency_marginal_preservation:
    file: mc_dependency_marginal_preservation.csv
    tolerance_tier: tier_B
    primary_key:
      - mc_mode
      - country_id
      - parameter_name
    columns:
      run_id: string
      mc_mode:
        type: string
        allowed_values:
          - MC_pairwise_05_check
          - MC_factor_nominal
          - MC_factor_rho03
          - MC_factor_rho07
          - MC_factor_rho08
      country_id: string
      parameter_name: string
      metric: string
      value: float
      pass_exact_preservation: bool
      parameter_set_id: string
      dataset_version: string
  mc_correlated_seed_check:
    file: mc_correlated_seed_check.csv
    tolerance_tier: tier_B
    primary_key:
      - country_id
      - policy_variant_id
      - scenario_id
      - regime_id
    columns:
      country_id: string
      policy_variant_id: string
      scenario_id: string
      regime_id: string
      prob_v_ge_1_seed707: float
      prob_v_ge_1_10_seed707: float
      prob_v_ge_1_seed1707: float
      prob_v_ge_1_10_seed1707: float
      abs_diff_prob_v_ge_1: float
      abs_diff_prob_v_ge_1_10: float
      tier_b_probability_tolerance: float
      within_tolerance: bool
  rank_dependency_matrix_approved:
    file: rank_dependency_matrix_approved.csv
    tolerance_tier: tier_B
    primary_key:
      - mc_mode
      - variable_a
      - variable_b
    columns:
      parameter_set_id: string
      mc_mode:
        type: string
        allowed_values:
          - MC_pairwise_05_check
          - MC_factor_nominal
          - MC_factor_rho03
          - MC_factor_rho07
          - MC_factor_rho08
      variable_a: string
      variable_b: string
      rho: float
      signed_pair_from_author: bool
      author_signed_rho: {type: float, nullable: true}
      dependency_structure: string
      psd_min_eigenvalue: float
      audit_status: string
      author_approval_date: string
      notes: string
  driver_ranking:
    file: driver_ranking.csv
    tolerance_tier: tier_B
    primary_key:
      - country_id
      - policy_variant_id
      - scenario_id
      - regime_id
      - rank_within_cell
    columns:
      run_id: string
      country_id: string
      policy_variant_id: string
      scenario_id: string
      regime_id: string
      parameter_name: string
      parameter_country_id: {type: string, nullable: true}
      parameter_scenario_id: {type: string, nullable: true}
      parameter_policy_id: {type: string, nullable: true}
      parameter_regime_id: {type: string, nullable: true}
      spearman_rho_with_v_gross: float
      abs_spearman_rho: float
      parameter_p10: float
      parameter_p90: float
      v_gross_at_parameter_p10_others_central: {type: float, nullable: true}
      v_gross_at_parameter_p90_others_central: {type: float, nullable: true}
      tornado_abs_range: {type: float, nullable: true}
      parameter_set_id: string
      dataset_version: string
      rank_within_cell: int
  country_policy_classification_final:
    file: country_policy_classification_final.csv
    primary_key:
      - country_id
      - policy_id
      - gmi_version
    columns:
      run_id: string
      country_id: string
      policy_id: string
      gmi_version: {type: string, nullable: true}
      preliminary_country_policy_result_class: string
      final_country_policy_result_class:
        type: string
        allowed_values:
          - robustly_feasible
          - conditionally_feasible
          - fragile_feasible
          - not_feasible
          - stress_benchmark_only
      probabilistic_leg: string
      max_prob_v_ge_1: float
      max_prob_v_ge_1_10: float
      min_valid_support_share: float
      classification_note: string
      parameter_set_id: string
      dataset_version: string
  robustness_table:
    file: robustness_table.csv
    primary_key:
      - variant_id
      - country_id
      - policy_variant_id
      - scenario_id
      - regime_id
    columns:
      run_id: string
      run_type:
        type: string
        allowed_values:
          - robustness
      variant_id: string
      variant_family: string
      variant_label: string
      country_id: string
      policy_id: string
      policy_variant_id: string
      gmi_version: {type: string, nullable: true}
      scenario_id: string
      regime_id: string
      headline_cell: bool
      v_baseline: float
      v_variant: float
      delta_v: float
      abs_delta_v: float
      baseline_cell_result_class: string
      variant_cell_result_class: string
      cambia_clase_celda: bool
      baseline_country_policy_result_class: string
      variant_country_policy_result_class: string
      cambia_clasificacion_pais_politica: bool
      baseline_reversed_flag: bool
      variant_note: string
      parameter_set_id: string
      baseline_parameter_set_id: string
      dataset_version: string
  diagnostic_result:
    file: diagnostic_result.csv
    primary_key:
      - variant_id
      - diagnostic_key
    columns:
      run_id: string
      run_type:
        type: string
        allowed_values:
          - robustness
      variant_id: string
      diagnostic_key: string
      diagnostic_value: string
      diagnostic_note: string
      parameter_set_id: string
      dataset_version: string
  hypothesis_adjudication:
    file: hypothesis_adjudication.csv
    primary_key:
      - hypothesis_id
    columns:
      tier: string
      hypothesis_id:
        type: string
        allowed_values:
          - H1
          - H2
          - H3
          - H4
          - H5
      statement: string
      evidence_summary: string
      verdict:
        type: string
        allowed_values:
          - HOLDS
          - VIOLATED
          - MIXED
          - NOT_TESTABLE
      preliminary_flag: bool
      evidence_file: string
      notes: string
