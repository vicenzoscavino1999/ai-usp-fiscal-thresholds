name: Reproducibility Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tier-a-fixture-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt
          pip install --no-deps -e .

      - name: Check mini snapshot fixture
        run: python -m json.tool tests/fixtures/mini_snapshot/dataset_manifest_mini.json > /dev/null

      - name: Verify frozen specification and protected tracked files
        run: python reproducibility/verify_freeze.py

      - name: Unit and contract tests with clean-checkout fixtures
        run: python -m pytest -q

      - name: Verify archived reference contract
        run: python reproducibility/verify.py --current reproducibility/reference --reference reproducibility/reference

      - name: Docker build smoke
        run: docker build -t ai-usp-fiscal-thresholds:ci .

      - name: Docker package smoke
        run: docker run --rm ai-usp-fiscal-thresholds:ci python -m pytest tests/test_zero_phi.py tests/test_verify.py -q
